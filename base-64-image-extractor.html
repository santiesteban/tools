<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Image Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-zinc-950 min-h-screen">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-white tracking-tight">Base64 Image Extractor</h1>
            <p class="mt-2 text-zinc-400">Upload HTML files to extract and download base64 encoded images</p>
        </div>

        <!-- Upload Area -->
        <div class="mb-8">
            <div id="uploadArea" class="relative block w-full rounded-lg border-2 border-dashed border-zinc-700 p-12 text-center hover:border-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-zinc-950 cursor-pointer transition-colors">
                <svg class="mx-auto h-12 w-12 text-zinc-500" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <h3 class="mt-2 text-sm font-semibold text-white">Upload HTML files</h3>
                <p class="mt-1 text-sm text-zinc-400">Drag and drop or click to browse</p>
                <input type="file" id="fileInput" accept=".html,.htm" multiple class="hidden">
            </div>
        </div>

        <!-- Stats and Actions -->
        <div id="stats" class="mb-8 hidden">
            <div class="rounded-lg bg-zinc-900 ring-1 ring-white/10">
                <dl class="divide-y divide-white/10">
                    <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-zinc-400">Files Processed</dt>
                        <dd class="mt-1 text-sm text-white sm:col-span-2 sm:mt-0" id="fileCount">0</dd>
                    </div>
                    <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-zinc-400">Images Found</dt>
                        <dd class="mt-1 text-sm text-white sm:col-span-2 sm:mt-0" id="imageCount">0</dd>
                    </div>
                    <div class="px-4 py-4 sm:px-6">
                        <div class="flex gap-3">
                            <button id="downloadAllBtn" class="inline-flex items-center gap-x-2 rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                <svg class="-ml-0.5 h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z" />
                                    <path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z" />
                                </svg>
                                Download All
                            </button>
                            <button id="clearBtn" class="inline-flex items-center gap-x-2 rounded-md bg-white/10 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-white/20">
                                Clear All
                            </button>
                        </div>
                    </div>
                </dl>
            </div>
        </div>

        <!-- Gallery -->
        <div id="gallery" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
            <svg class="mx-auto h-12 w-12 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            </svg>
            <h3 class="mt-2 text-sm font-semibold text-white">No images yet</h3>
            <p class="mt-1 text-sm text-zinc-400">Upload HTML files to extract base64 encoded images</p>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const stats = document.getElementById('stats');
        const fileCountEl = document.getElementById('fileCount');
        const imageCountEl = document.getElementById('imageCount');
        const clearBtn = document.getElementById('clearBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        let images = [];
        let filesProcessed = 0;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-indigo-500');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-indigo-500');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-indigo-500');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        clearBtn.addEventListener('click', () => {
            images = [];
            filesProcessed = 0;
            updateDisplay();
        });

        downloadAllBtn.addEventListener('click', async () => {
            const zip = new JSZip();
            
            for (let i = 0; i < images.length; i++) {
                const img = images[i];
                const base64Data = img.src.split(',')[1];
                zip.file(img.downloadName, base64Data, {base64: true});
            }

            const content = await zip.generateAsync({type: 'blob'});
            
            // Create a temporary anchor element and trigger download
            const url = window.URL.createObjectURL(content);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'extracted-images.zip';
            document.body.appendChild(a);
            a.click();
            
            // Cleanup
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        });

        function handleFiles(files) {
            const htmlFiles = Array.from(files).filter(f => 
                f.name.endsWith('.html') || f.name.endsWith('.htm')
            );

            htmlFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    extractImages(e.target.result, file.name);
                    filesProcessed++;
                    updateDisplay();
                };
                reader.readAsText(file);
            });
        }

        function extractImages(htmlContent, fileName) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, 'text/html');
            const baseFileName = fileName.replace(/\.html?$/i, '');
            
            // Find all img tags with base64 src
            const imgTags = doc.querySelectorAll('img[src^="data:image"]');
            imgTags.forEach((img, idx) => {
                const ext = getImageExtension(img.src);
                images.push({
                    src: img.src,
                    fileName: fileName,
                    index: idx + 1,
                    downloadName: imgTags.length > 1 ? `${baseFileName}_${idx + 1}.${ext}` : `${baseFileName}.${ext}`,
                    sortKey: `${fileName}_${String(idx + 1).padStart(5, '0')}`
                });
            });

            // Find base64 in style attributes and CSS
            const allElements = doc.querySelectorAll('*');
            let bgIdx = 0;
            allElements.forEach(el => {
                const style = el.getAttribute('style');
                if (style) {
                    const bgMatches = style.match(/url\(['"]?(data:image[^'")\s]+)['"]?\)/g);
                    if (bgMatches) {
                        bgMatches.forEach((match) => {
                            const dataUrl = match.match(/data:image[^'")\s]+/)[0];
                            const ext = getImageExtension(dataUrl);
                            bgIdx++;
                            images.push({
                                src: dataUrl,
                                fileName: fileName,
                                index: `bg-${bgIdx}`,
                                downloadName: `${baseFileName}_bg${bgIdx}.${ext}`,
                                sortKey: `${fileName}_bg${String(bgIdx).padStart(5, '0')}`
                            });
                        });
                    }
                }
            });

            // Find base64 in style tags
            const styleTags = doc.querySelectorAll('style');
            let cssIdx = 0;
            styleTags.forEach(styleTag => {
                const bgMatches = styleTag.textContent.match(/url\(['"]?(data:image[^'")\s]+)['"]?\)/g);
                if (bgMatches) {
                    bgMatches.forEach((match) => {
                        const dataUrl = match.match(/data:image[^'")\s]+/)[0];
                        const ext = getImageExtension(dataUrl);
                        cssIdx++;
                        images.push({
                            src: dataUrl,
                            fileName: fileName,
                            index: `css-${cssIdx}`,
                            downloadName: `${baseFileName}_css${cssIdx}.${ext}`,
                            sortKey: `${fileName}_css${String(cssIdx).padStart(5, '0')}`
                        });
                    });
                }
            });
        }

        function getImageExtension(dataUrl) {
            const match = dataUrl.match(/data:image\/([^;]+)/);
            return match ? match[1] : 'png';
        }

        function updateDisplay() {
            fileCountEl.textContent = filesProcessed;
            imageCountEl.textContent = images.length;

            if (images.length > 0) {
                emptyState.classList.add('hidden');
                stats.classList.remove('hidden');
                renderGallery();
            } else {
                emptyState.classList.remove('hidden');
                stats.classList.add('hidden');
                gallery.innerHTML = '';
            }
        }

        function renderGallery() {
            // Sort images alphabetically by sortKey
            const sortedImages = [...images].sort((a, b) => 
                a.sortKey.localeCompare(b.sortKey)
            );

            gallery.innerHTML = sortedImages.map((img, idx) => `
                <div class="relative flex flex-col overflow-hidden rounded-lg bg-zinc-900 ring-1 ring-white/10">
                    <div class="flex-1 p-4">
                        <div class="aspect-square w-full overflow-hidden rounded-md bg-zinc-800 flex items-center justify-center">
                            <img src="${img.src}" alt="Extracted image" class="h-full w-full object-contain">
                        </div>
                        <div class="mt-4">
                            <h3 class="text-sm font-medium text-white truncate" title="${img.fileName}">${img.fileName}</h3>
                            <p class="mt-1 text-sm text-zinc-400">Image #${img.index}</p>
                            <p class="mt-1 text-xs text-zinc-500 truncate" title="${img.downloadName}">${img.downloadName}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="downloadImage(${images.indexOf(img)})" class="w-full inline-flex justify-center items-center gap-x-2 rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z" />
                                <path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z" />
                            </svg>
                            Download
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function downloadImage(idx) {
            const img = images[idx];
            const link = document.createElement('a');
            link.href = img.src;
            link.download = img.downloadName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
