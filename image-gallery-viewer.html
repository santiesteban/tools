<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 min-h-screen">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-white tracking-tight">Image Gallery Viewer</h1>
            <p class="mt-2 text-zinc-400">Upload images to view and zoom</p>
        </div>

        <!-- Upload Area -->
        <div class="mb-8">
            <div id="uploadArea" class="relative block w-full rounded-lg border-2 border-dashed border-zinc-700 p-12 text-center hover:border-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-zinc-950 cursor-pointer transition-colors">
                <svg class="mx-auto h-12 w-12 text-zinc-500" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <h3 class="mt-2 text-sm font-semibold text-white">Upload images</h3>
                <p class="mt-1 text-sm text-zinc-400">Drag and drop or click to browse</p>
                <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
            </div>
        </div>

        <!-- Stats -->
        <div id="stats" class="mb-8 hidden">
            <div class="rounded-lg bg-zinc-900 ring-1 ring-white/10">
                <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                    <dt class="text-sm font-medium text-zinc-400">Images Loaded</dt>
                    <dd class="mt-1 text-sm text-white sm:col-span-2 sm:mt-0">
                        <span id="imageCount">0</span>
                        <button id="clearBtn" class="ml-4 inline-flex items-center gap-x-2 rounded-md bg-white/10 px-3 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-white/20">
                            Clear All
                        </button>
                    </dd>
                </div>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery" class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
            <svg class="mx-auto h-12 w-12 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <h3 class="mt-2 text-sm font-semibold text-white">No images yet</h3>
            <p class="mt-1 text-sm text-zinc-400">Upload images to view them in the gallery</p>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="hidden fixed inset-0 bg-black bg-opacity-95 z-50 flex items-center justify-center">
        <button id="closeLightbox" class="absolute top-4 right-4 text-white hover:text-zinc-300 z-50">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <button id="prevImage" class="absolute left-4 text-white hover:text-zinc-300 z-50">
            <svg class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>

        <button id="nextImage" class="absolute right-4 text-white hover:text-zinc-300 z-50">
            <svg class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>

        <div id="imageContainer" class="relative w-full h-full flex items-center justify-center p-16">
            <img id="lightboxImage" src="" alt="" class="max-w-full max-h-full object-contain cursor-zoom-in">
        </div>

        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-white text-sm bg-black bg-opacity-50 px-4 py-2 rounded-lg">
            <span id="imageCounter">1 / 1</span>
            <span class="mx-2">•</span>
            <span id="imageName">image.jpg</span>
        </div>

        <div class="absolute top-4 left-4 flex gap-2 z-50">
            <button id="zoomIn" class="text-white hover:text-zinc-300 bg-black bg-opacity-50 p-2 rounded-lg">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
                </svg>
            </button>
            <button id="zoomOut" class="text-white hover:text-zinc-300 bg-black bg-opacity-50 p-2 rounded-lg">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" />
                </svg>
            </button>
            <button id="resetZoom" class="text-white hover:text-zinc-300 bg-black bg-opacity-50 p-2 rounded-lg">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const stats = document.getElementById('stats');
        const imageCountEl = document.getElementById('imageCount');
        const clearBtn = document.getElementById('clearBtn');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const closeLightbox = document.getElementById('closeLightbox');
        const prevImage = document.getElementById('prevImage');
        const nextImage = document.getElementById('nextImage');
        const imageCounter = document.getElementById('imageCounter');
        const imageName = document.getElementById('imageName');
        const imageContainer = document.getElementById('imageContainer');
        const zoomIn = document.getElementById('zoomIn');
        const zoomOut = document.getElementById('zoomOut');
        const resetZoom = document.getElementById('resetZoom');

        let images = [];
        let currentImageIndex = 0;
        let currentZoom = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-indigo-500');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-indigo-500');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-indigo-500');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        clearBtn.addEventListener('click', () => {
            images = [];
            updateDisplay();
        });

        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            
            imageFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    images.push({
                        src: e.target.result,
                        name: file.name
                    });
                    updateDisplay();
                };
                reader.readAsDataURL(file);
            });
        }

        function updateDisplay() {
            imageCountEl.textContent = images.length;

            if (images.length > 0) {
                emptyState.classList.add('hidden');
                stats.classList.remove('hidden');
                renderGallery();
            } else {
                emptyState.classList.remove('hidden');
                stats.classList.add('hidden');
                gallery.innerHTML = '';
            }
        }

        function renderGallery() {
            gallery.innerHTML = images.map((img, idx) => `
                <div class="relative group cursor-pointer" onclick="openLightbox(${idx})">
                    <div class="aspect-square overflow-hidden rounded-lg bg-zinc-900 ring-1 ring-white/10">
                        <img src="${img.src}" alt="${img.name}" class="h-full w-full object-cover transition-transform group-hover:scale-110">
                    </div>
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-opacity rounded-lg flex items-center justify-center">
                        <svg class="h-8 w-8 text-white opacity-0 group-hover:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
                        </svg>
                    </div>
                </div>
            `).join('');
        }

        function openLightbox(index) {
            currentImageIndex = index;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            showImage();
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function showImage() {
            const img = images[currentImageIndex];
            lightboxImage.src = img.src;
            lightboxImage.alt = img.name;
            imageCounter.textContent = `${currentImageIndex + 1} / ${images.length}`;
            imageName.textContent = img.name;
            updateImageTransform();
        }

        function updateImageTransform() {
            lightboxImage.style.transform = `scale(${currentZoom}) translate(${translateX}px, ${translateY}px)`;
            lightboxImage.style.cursor = currentZoom > 1 ? 'grab' : 'zoom-in';
        }

        closeLightbox.addEventListener('click', () => {
            lightbox.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        prevImage.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            showImage();
        });

        nextImage.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            showImage();
        });

        zoomIn.addEventListener('click', () => {
            currentZoom = Math.min(currentZoom + 0.5, 5);
            updateImageTransform();
        });

        zoomOut.addEventListener('click', () => {
            currentZoom = Math.max(currentZoom - 0.5, 1);
            if (currentZoom === 1) {
                translateX = 0;
                translateY = 0;
            }
            updateImageTransform();
        });

        resetZoom.addEventListener('click', () => {
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updateImageTransform();
        });

        lightboxImage.addEventListener('click', () => {
            if (currentZoom === 1) {
                currentZoom = 2;
            } else {
                currentZoom = 1;
                translateX = 0;
                translateY = 0;
            }
            updateImageTransform();
        });

        // Pan functionality
        lightboxImage.addEventListener('mousedown', (e) => {
            if (currentZoom > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                lightboxImage.style.cursor = 'grabbing';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateImageTransform();
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                lightboxImage.style.cursor = 'grab';
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') {
                    lightbox.classList.add('hidden');
                    document.body.style.overflow = 'auto';
                } else if (e.key === 'ArrowLeft') {
                    prevImage.click();
                } else if (e.key === 'ArrowRight') {
                    nextImage.click();
                } else if (e.key === '+' || e.key === '=') {
                    zoomIn.click();
                } else if (e.key === '-') {
                    zoomOut.click();
                } else if (e.key === '0') {
                    resetZoom.click();
                }
            }
        });

        // Close on background click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target === imageContainer) {
                lightbox.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });
    </script>
</body>
</html>
