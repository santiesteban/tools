<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Layer Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/ui@latest/dist/tailwind-ui.min.css">
    <style>
        body { margin: 0; overflow: hidden; }
        .drag-handle { 
            cursor: grab;
            touch-action: none;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .layer-item.dragging { 
            opacity: 0.4;
            transform: scale(0.95);
        }
        .layer-item {
            transition: transform 0.1s ease, opacity 0.1s ease;
        }
        #canvas { cursor: default; }
        #canvas.panning { cursor: grab; }
        #canvas.panning-active { cursor: grabbing; }
        #canvas.resize-ns { cursor: ns-resize; }
        #canvas.resize-ew { cursor: ew-resize; }
        #canvas.resize-nwse { cursor: nwse-resize; }
        #canvas.resize-nesw { cursor: nesw-resize; }
        #canvas.rotate { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>') 12 12, auto; }
        .layer-item.selected { 
            background: linear-gradient(to right, #1e40af, #3b82f6);
            box-shadow: 0 0 0 2px #3b82f6;
        }
        .layer-item.temp-top {
            background: linear-gradient(to right, #065f46, #059669);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="flex h-screen">
        <!-- Side Menu -->
        <div class="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col">
            <div class="p-6 border-b border-zinc-800">
                <h1 class="text-2xl font-semibold text-white">Map Layers</h1>
            </div>
            
            <div class="p-4 border-b border-zinc-800">
                <label class="block w-full">
                    <div class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg cursor-pointer text-center transition shadow-sm">
                        <span class="flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                            Upload Map Images
                        </span>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
                </label>
                <div class="mt-3 text-xs text-zinc-500 text-center">
                    💡 Your layer positions & settings are saved in the URL
                </div>
            </div>

            <!-- Layers List -->
            <div class="flex-1 overflow-y-auto p-4">
                <div id="layersList" class="space-y-2"></div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-1 relative overflow-hidden bg-zinc-950">
            <canvas id="canvas" class="w-full h-full"></canvas>
            
            <!-- Controls -->
            <div class="absolute top-6 right-6 flex gap-2">
                <button id="canvasZoomIn" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-3 rounded-lg shadow-xl transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                </button>
                <button id="canvasZoomOut" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-3 rounded-lg shadow-xl transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
                    </svg>
                </button>
            </div>

            <!-- Save indicator -->
            <div id="saveIndicator" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none">
                <div class="flex items-center gap-2 text-sm text-zinc-300">
                    <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    State saved to URL
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const layersList = document.getElementById('layersList');

        let layers = [];
        let selectedLayer = null;
        let tempTopLayer = null;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let isResizing = false;
        let isRotating = false;
        let dragStart = { x: 0, y: 0 };
        let resizeEdge = null;
        let rotateStart = 0;
        let spacePressed = false;
        let updateUrlTimeout = null;

        // Load state from URL
        function loadStateFromUrl() {
            try {
                const hash = window.location.hash.slice(1);
                if (hash) {
                    const decoded = atob(hash);
                    const state = JSON.parse(decoded);
                    return state;
                }
            } catch (e) {
                console.error('Failed to load state from URL:', e);
            }
            return null;
        }

        // Save state to URL
        function saveStateToUrl() {
            const state = {
                layers: layers.map(layer => ({
                    name: layer.name,
                    visible: layer.visible,
                    opacity: layer.opacity,
                    x: layer.x,
                    y: layer.y,
                    width: layer.width,
                    height: layer.height,
                    rotation: layer.rotation
                })),
                canvas: {
                    scale: scale,
                    offsetX: offsetX,
                    offsetY: offsetY
                }
            };
            
            const encoded = btoa(JSON.stringify(state));
            window.history.replaceState(null, '', '#' + encoded);
            
            // Show save indicator
            const indicator = document.getElementById('saveIndicator');
            indicator.style.opacity = '1';
            setTimeout(() => {
                indicator.style.opacity = '0';
            }, 2000);
        }

        // Debounced URL update
        function scheduleUrlUpdate() {
            if (updateUrlTimeout) {
                clearTimeout(updateUrlTimeout);
            }
            updateUrlTimeout = setTimeout(() => {
                saveStateToUrl();
            }, 500);
        }

        const savedState = loadStateFromUrl();

        // Canvas setup
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            render();
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Restore canvas state if available
        if (savedState && savedState.canvas) {
            scale = savedState.canvas.scale;
            offsetX = savedState.canvas.offsetX;
            offsetY = savedState.canvas.offsetY;
        }

        // File upload
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach((file, idx) => {
                const img = new Image();
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    img.onload = () => {
                        // Check if we have saved state for this file
                        let layerState = null;
                        if (savedState && savedState.layers) {
                            layerState = savedState.layers.find(l => l.name === file.name);
                        }
                        
                        const newLayer = {
                            id: Date.now() + idx,
                            name: file.name,
                            image: img,
                            visible: layerState ? layerState.visible : true,
                            opacity: layerState ? layerState.opacity : 1,
                            x: layerState ? layerState.x : 0,
                            y: layerState ? layerState.y : 0,
                            width: layerState ? layerState.width : img.width,
                            height: layerState ? layerState.height : img.height,
                            rotation: layerState ? layerState.rotation : 0
                        };
                        
                        // If we have saved state, insert in the correct position
                        if (savedState && savedState.layers) {
                            const savedIndex = savedState.layers.findIndex(l => l.name === file.name);
                            if (savedIndex !== -1) {
                                layers.splice(savedIndex, 0, newLayer);
                            } else {
                                layers.unshift(newLayer);
                            }
                        } else {
                            layers.unshift(newLayer);
                        }
                        
                        updateLayersList();
                        render();
                        scheduleUrlUpdate();
                    };
                    img.src = event.target.result;
                };
                
                reader.readAsDataURL(file);
            });
            fileInput.value = '';
        });

        // Draw grid
        function drawGrid() {
            const gridSize = 50;
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);
            
            ctx.strokeStyle = '#27272a';
            ctx.lineWidth = 1 / scale;
            
            const startX = Math.floor(-offsetX / scale / gridSize) * gridSize;
            const startY = Math.floor(-offsetY / scale / gridSize) * gridSize;
            const endX = startX + canvas.width / scale + gridSize;
            const endY = startY + canvas.height / scale + gridSize;
            
            for (let x = startX; x < endX; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, startY);
                ctx.lineTo(x, endY);
                ctx.stroke();
            }
            
            for (let y = startY; y < endY; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        // Render canvas
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            const renderOrder = [...layers].reverse();
            if (tempTopLayer) {
                const idx = renderOrder.findIndex(l => l.id === tempTopLayer.id);
                if (idx !== -1) {
                    renderOrder.splice(idx, 1);
                    renderOrder.push(tempTopLayer);
                }
            }

            renderOrder.forEach(layer => {
                if (layer.visible && layer.image) {
                    ctx.globalAlpha = layer.opacity;
                    ctx.save();
                    
                    const centerX = (canvas.width / scale - layer.image.width) / 2 + layer.x;
                    const centerY = (canvas.height / scale - layer.image.height) / 2 + layer.y;
                    
                    ctx.translate(centerX + layer.width / 2, centerY + layer.height / 2);
                    ctx.rotate(layer.rotation);
                    ctx.translate(-layer.width / 2, -layer.height / 2);
                    
                    ctx.drawImage(layer.image, 0, 0, layer.width, layer.height);
                    
                    // Draw selection border and handles
                    if ((selectedLayer && selectedLayer.id === layer.id) || 
                        (tempTopLayer && tempTopLayer.id === layer.id)) {
                        const color = tempTopLayer && tempTopLayer.id === layer.id ? '#10b981' : '#3b82f6';
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 2 / scale;
                        ctx.strokeRect(-5, -5, layer.width + 10, layer.height + 10);
                        
                        // Corner handles for rotation
                        ctx.fillStyle = color;
                        const handleSize = 12 / scale;
                        ctx.fillRect(-handleSize/2, -handleSize/2, handleSize, handleSize);
                        ctx.fillRect(layer.width - handleSize/2, -handleSize/2, handleSize, handleSize);
                        ctx.fillRect(-handleSize/2, layer.height - handleSize/2, handleSize, handleSize);
                        ctx.fillRect(layer.width - handleSize/2, layer.height - handleSize/2, handleSize, handleSize);
                        
                        // Edge handles for resizing
                        const edgeSize = 8 / scale;
                        ctx.fillRect(layer.width/2 - edgeSize/2, -edgeSize/2, edgeSize, edgeSize);
                        ctx.fillRect(layer.width/2 - edgeSize/2, layer.height - edgeSize/2, edgeSize, edgeSize);
                        ctx.fillRect(-edgeSize/2, layer.height/2 - edgeSize/2, edgeSize, edgeSize);
                        ctx.fillRect(layer.width - edgeSize/2, layer.height/2 - edgeSize/2, edgeSize, edgeSize);
                    }
                    ctx.restore();
                }
            });

            ctx.restore();
        }

        // Get mouse position in canvas coordinates
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - offsetX) / scale,
                y: (e.clientY - rect.top - offsetY) / scale
            };
        }

        // Transform point by layer rotation
        function transformPoint(x, y, layer) {
            const centerX = (canvas.width / scale - layer.image.width) / 2 + layer.x + layer.width / 2;
            const centerY = (canvas.height / scale - layer.image.height) / 2 + layer.y + layer.height / 2;
            
            const dx = x - centerX;
            const dy = y - centerY;
            const cos = Math.cos(-layer.rotation);
            const sin = Math.sin(-layer.rotation);
            
            return {
                x: dx * cos - dy * sin + layer.width / 2,
                y: dx * sin + dy * cos + layer.height / 2
            };
        }

        // Check if point is inside layer or on handles
        function getInteractionAtPoint(x, y) {
            const renderOrder = [...layers].reverse();
            if (tempTopLayer) {
                const idx = renderOrder.findIndex(l => l.id === tempTopLayer.id);
                if (idx !== -1) {
                    renderOrder.splice(idx, 1);
                    renderOrder.push(tempTopLayer);
                }
            }

            for (let i = renderOrder.length - 1; i >= 0; i--) {
                const layer = renderOrder[i];
                if (!layer.visible) continue;
                
                const local = transformPoint(x, y, layer);
                const handleSize = 12 / scale;
                const edgeThreshold = 15 / scale;
                
                // Check corners for rotation
                if (selectedLayer && selectedLayer.id === layer.id) {
                    const corners = [
                        {x: 0, y: 0, cursor: 'nwse'},
                        {x: layer.width, y: 0, cursor: 'nesw'},
                        {x: 0, y: layer.height, cursor: 'nesw'},
                        {x: layer.width, y: layer.height, cursor: 'nwse'}
                    ];
                    
                    for (let corner of corners) {
                        if (Math.abs(local.x - corner.x) < handleSize && 
                            Math.abs(local.y - corner.y) < handleSize) {
                            return {layer, type: 'rotate', corner: corner.cursor};
                        }
                    }
                    
                    // Check edges for resizing
                    if (Math.abs(local.y) < edgeThreshold && local.x >= 0 && local.x <= layer.width) {
                        return {layer, type: 'resize', edge: 'top', cursor: 'ns'};
                    }
                    if (Math.abs(local.y - layer.height) < edgeThreshold && local.x >= 0 && local.x <= layer.width) {
                        return {layer, type: 'resize', edge: 'bottom', cursor: 'ns'};
                    }
                    if (Math.abs(local.x) < edgeThreshold && local.y >= 0 && local.y <= layer.height) {
                        return {layer, type: 'resize', edge: 'left', cursor: 'ew'};
                    }
                    if (Math.abs(local.x - layer.width) < edgeThreshold && local.y >= 0 && local.y <= layer.height) {
                        return {layer, type: 'resize', edge: 'right', cursor: 'ew'};
                    }
                }
                
                // Check if inside layer
                if (local.x >= 0 && local.x <= layer.width &&
                    local.y >= 0 && local.y <= layer.height) {
                    return {layer, type: 'drag'};
                }
            }
            return null;
        }

        // Update layers list UI
        function updateLayersList() {
            layersList.innerHTML = '';
            layers.forEach((layer, index) => {
                const div = document.createElement('div');
                let classes = 'layer-item bg-zinc-800 hover:bg-zinc-700 p-3 rounded-lg border border-zinc-700 transition';
                if (selectedLayer && selectedLayer.id === layer.id) {
                    classes += ' selected';
                } else if (tempTopLayer && tempTopLayer.id === layer.id) {
                    classes += ' temp-top';
                }
                div.className = classes;
                div.dataset.index = index;
                div.dataset.id = layer.id;
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 mb-3">
                        <svg class="drag-handle w-4 h-4 text-zinc-500 hover:text-zinc-300 cursor-move flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/>
                        </svg>
                        <input type="checkbox" ${layer.visible ? 'checked' : ''} 
                               class="layer-visible w-4 h-4 rounded border-zinc-600 text-blue-600 focus:ring-blue-500 focus:ring-offset-zinc-900 flex-shrink-0" data-id="${layer.id}">
                        <span class="layer-name flex-1 truncate text-sm font-medium cursor-pointer" data-id="${layer.id}">${layer.name}</span>
                        <button class="layer-delete text-red-400 hover:text-red-300 flex-shrink-0" data-id="${layer.id}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-zinc-500 font-medium">Opacity:</span>
                        <input type="range" min="0" max="100" value="${layer.opacity * 100}" 
                               class="layer-opacity flex-1" data-id="${layer.id}">
                        <span class="text-xs text-zinc-400 w-10 text-right font-mono">${Math.round(layer.opacity * 100)}%</span>
                    </div>
                `;
                
                layersList.appendChild(div);
            });

            // Layer name click to select
            document.querySelectorAll('.layer-name').forEach(span => {
                span.addEventListener('click', (e) => {
                    const layer = layers.find(l => l.id == e.target.dataset.id);
                    if (layer) {
                        selectedLayer = layer;
                        tempTopLayer = layer;
                        updateLayersList();
                        render();
                    }
                });
            });

            document.querySelectorAll('.layer-visible').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const layer = layers.find(l => l.id == e.target.dataset.id);
                    if (layer) {
                        layer.visible = e.target.checked;
                        render();
                        scheduleUrlUpdate();
                    }
                });
            });

            document.querySelectorAll('.layer-opacity').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const layer = layers.find(l => l.id == e.target.dataset.id);
                    if (layer) {
                        layer.opacity = e.target.value / 100;
                        e.target.nextElementSibling.textContent = Math.round(e.target.value) + '%';
                        render();
                        scheduleUrlUpdate();
                    }
                });
            });

            document.querySelectorAll('.layer-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    layers = layers.filter(l => l.id != e.currentTarget.dataset.id);
                    if (selectedLayer && selectedLayer.id == e.currentTarget.dataset.id) {
                        selectedLayer = null;
                    }
                    if (tempTopLayer && tempTopLayer.id == e.currentTarget.dataset.id) {
                        tempTopLayer = null;
                    }
                    updateLayersList();
                    render();
                    scheduleUrlUpdate();
                });
            });

            // Drag and drop for reordering
            let dragSrcEl = null;

            document.querySelectorAll('.layer-item').forEach((item) => {
                const handle = item.querySelector('.drag-handle');
                
                handle.addEventListener('mousedown', (e) => {
                    item.setAttribute('draggable', 'true');
                });
                
                handle.addEventListener('mouseup', (e) => {
                    setTimeout(() => item.setAttribute('draggable', 'false'), 100);
                });
                
                item.addEventListener('dragstart', (e) => {
                    if (item.getAttribute('draggable') !== 'true') {
                        e.preventDefault();
                        return;
                    }
                    dragSrcEl = item;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/html', item.innerHTML);
                    item.classList.add('dragging');
                });

                item.addEventListener('dragend', (e) => {
                    item.classList.remove('dragging');
                    item.setAttribute('draggable', 'false');
                    
                    // Reorder layers based on DOM order
                    const items = Array.from(layersList.children);
                    const newLayers = items.map(el => {
                        const oldIndex = parseInt(el.dataset.index);
                        return layers[oldIndex];
                    });
                    layers = newLayers;
                    updateLayersList();
                    render();
                    scheduleUrlUpdate();
                });

                item.addEventListener('dragover', (e) => {
                    if (e.preventDefault) {
                        e.preventDefault();
                    }
                    e.dataTransfer.dropEffect = 'move';
                    return false;
                });

                item.addEventListener('dragenter', (e) => {
                    if (item !== dragSrcEl) {
                        const rect = item.getBoundingClientRect();
                        const midpoint = rect.top + rect.height / 2;
                        
                        if (e.clientY < midpoint) {
                            item.parentNode.insertBefore(dragSrcEl, item);
                        } else {
                            item.parentNode.insertBefore(dragSrcEl, item.nextSibling);
                        }
                    }
                });
            });
        }

        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !spacePressed) {
                e.preventDefault();
                spacePressed = true;
                if (spacePressed) {
                    canvas.classList.add('panning');
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                spacePressed = false;
                canvas.classList.remove('panning');
            }
        });

        // Canvas interaction
        canvas.addEventListener('mousedown', (e) => {
            const pos = getCanvasPos(e);
            
            if (spacePressed) {
                // Pan mode
                isDragging = true;
                dragStart = { x: e.clientX - offsetX, y: e.clientY - offsetY };
                canvas.classList.add('panning-active');
            } else {
                // Select/drag layer mode
                const interaction = getInteractionAtPoint(pos.x, pos.y);
                
                if (interaction) {
                    selectedLayer = interaction.layer;
                    tempTopLayer = interaction.layer;
                    
                    if (interaction.type === 'rotate') {
                        isRotating = true;
                        const centerX = (canvas.width / scale - interaction.layer.image.width) / 2 + interaction.layer.x + interaction.layer.width / 2;
                        const centerY = (canvas.height / scale - interaction.layer.image.height) / 2 + interaction.layer.y + interaction.layer.height / 2;
                        rotateStart = Math.atan2(pos.y - centerY, pos.x - centerX) - interaction.layer.rotation;
                    } else if (interaction.type === 'resize') {
                        isResizing = true;
                        resizeEdge = interaction.edge;
                        dragStart = {x: pos.x, y: pos.y, width: interaction.layer.width, height: interaction.layer.height, lx: interaction.layer.x, ly: interaction.layer.y};
                    } else {
                        isDragging = true;
                        dragStart = { x: pos.x - interaction.layer.x, y: pos.y - interaction.layer.y };
                    }
                    updateLayersList();
                } else {
                    selectedLayer = null;
                    tempTopLayer = null;
                    updateLayersList();
                }
                render();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const pos = getCanvasPos(e);
            
            // Update cursor based on hover
            if (!isDragging && !isResizing && !isRotating && !spacePressed) {
                const interaction = getInteractionAtPoint(pos.x, pos.y);
                canvas.className = '';
                if (interaction) {
                    if (interaction.type === 'rotate') {
                        canvas.classList.add('rotate');
                    } else if (interaction.type === 'resize') {
                        canvas.classList.add('resize-' + interaction.cursor);
                    }
                }
            }
            
            if (isDragging && spacePressed) {
                offsetX = e.clientX - dragStart.x;
                offsetY = e.clientY - dragStart.y;
                render();
            } else if (isDragging && selectedLayer) {
                selectedLayer.x = pos.x - dragStart.x;
                selectedLayer.y = pos.y - dragStart.y;
                render();
            } else if (isResizing && selectedLayer) {
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;
                const cos = Math.cos(-selectedLayer.rotation);
                const sin = Math.sin(-selectedLayer.rotation);
                const rdx = dx * cos - dy * sin;
                const rdy = dx * sin + dy * cos;
                
                const aspectRatio = selectedLayer.image.width / selectedLayer.image.height;
                
                if (resizeEdge === 'right') {
                    const newWidth = Math.max(50, dragStart.width + rdx);
                    selectedLayer.width = newWidth;
                    selectedLayer.height = newWidth / aspectRatio;
                } else if (resizeEdge === 'left') {
                    const newWidth = Math.max(50, dragStart.width - rdx);
                    const widthDiff = newWidth - dragStart.width;
                    selectedLayer.width = newWidth;
                    selectedLayer.height = newWidth / aspectRatio;
                    selectedLayer.x = dragStart.lx - widthDiff * cos;
                    selectedLayer.y = dragStart.ly - widthDiff * sin;
                } else if (resizeEdge === 'bottom') {
                    const newHeight = Math.max(50 / aspectRatio, dragStart.height + rdy);
                    selectedLayer.height = newHeight;
                    selectedLayer.width = newHeight * aspectRatio;
                } else if (resizeEdge === 'top') {
                    const newHeight = Math.max(50 / aspectRatio, dragStart.height - rdy);
                    const heightDiff = newHeight - dragStart.height;
                    selectedLayer.height = newHeight;
                    selectedLayer.width = newHeight * aspectRatio;
                    selectedLayer.x = dragStart.lx + heightDiff * sin;
                    selectedLayer.y = dragStart.ly - heightDiff * cos;
                }
                render();
            } else if (isRotating && selectedLayer) {
                const centerX = (canvas.width / scale - selectedLayer.image.width) / 2 + selectedLayer.x + selectedLayer.width / 2;
                const centerY = (canvas.height / scale - selectedLayer.image.height) / 2 + selectedLayer.y + selectedLayer.height / 2;
                selectedLayer.rotation = Math.atan2(pos.y - centerY, pos.x - centerX) - rotateStart;
                render();
            }
        });

        canvas.addEventListener('mouseup', () => {
            const wasModifying = isDragging || isResizing || isRotating;
            const wasPanning = isDragging && spacePressed;
            isDragging = false;
            isResizing = false;
            isRotating = false;
            canvas.classList.remove('panning-active');
            
            if ((wasModifying && selectedLayer) || wasPanning) {
                scheduleUrlUpdate();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            const wasModifying = isDragging || isResizing || isRotating;
            const wasPanning = isDragging && spacePressed;
            isDragging = false;
            isResizing = false;
            isRotating = false;
            canvas.classList.remove('panning-active');
            
            if ((wasModifying && selectedLayer) || wasPanning) {
                scheduleUrlUpdate();
            }
        });

        // Canvas zoom controls
        document.getElementById('canvasZoomIn').addEventListener('click', () => {
            scale *= 1.2;
            render();
            scheduleUrlUpdate();
        });

        document.getElementById('canvasZoomOut').addEventListener('click', () => {
            scale /= 1.2;
            render();
            scheduleUrlUpdate();
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale *= delta;
            render();
            scheduleUrlUpdate();
        });
    </script>
</body>
</html>
